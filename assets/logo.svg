<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="30%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#FDF2C7"/>
      <stop offset="70%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="15%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#FDF2C7"/>
      <stop offset="85%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Top Gold Line -->
  <line x1="40" y1="18" x2="560" y2="18" stroke="url(#goldLine)" stroke-width="1.5" />
  
  <!-- Main Brand Title STONEMERE -->
  <text x="300" y="58" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="42" font-weight="600" fill="url(#goldGradient)" letter-spacing="14">STONEMERE</text>
  
  <!-- Bottom Gold Line -->
  <line x1="40" y1="72" x2="560" y2="72" stroke="url(#goldLine)" stroke-width="1.5" />
  
  <!-- Subtitle Line 1 -->
  <text x="300" y="96" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#EAEAEA" letter-spacing="1.2">Private Elder Life Management - Family Affairs Coordination</text>
  
  <!-- Subtitle Line 2: Locations -->
  <text x="300" y="118" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#D5D5D5" letter-spacing="2.5">
    <tspan fill="#C5A059">•</tspan> Bath <tspan fill="#C5A059">•</tspan> Cotswolds <tspan fill="#C5A059">•</tspan> London
  </text>
</svg>
